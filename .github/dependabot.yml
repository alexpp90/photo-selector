# Dependency update PRs. Grouped and monthly so they arrive as a few reviewable PRs, not a
# stream. Covered: the Android Gradle build (both Android products and :core), the GitHub
# Actions used by every workflow and by the composite actions in .github/actions/, and the
# Python dependencies of the legacy Desktop and Blitzlens (minor and patch updates only: the
# legacy Desktop is archived, but its locked Pillow once carried ~60 advisories that nobody was
# told about). Not covered on purpose: macOS Desktop (SwiftPM, no external packages).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /products/android
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Toolchain moves together: AGP, Kotlin, KSP and the Compose compiler must agree.
      android-toolchain:
        patterns:
          - "com.android.*"
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
      androidx:
        patterns:
          - "androidx.*"
      test-libraries:
        patterns:
          - "junit*"
          - "org.robolectric*"
          - "io.mockk*"
          - "app.cash.turbine*"
          - "org.jetbrains.kotlinx:kotlinx-coroutines-test"
      other:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  # Poetry projects (poetry.lock beside each pyproject.toml). Majors are decided by a person.
  - package-ecosystem: pip
    directories:
      - /products/desktop
      - /products/linux-desktop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python-dependencies:
        patterns:
          - "*"
