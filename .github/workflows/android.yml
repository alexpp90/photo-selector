name: Android CI

# Single pipeline for the Android solutions: tests always run; packaging,
# signing, and publishing only happen on pushes to main or on a product
# release tag (and manual dispatch). Builds depend on tests via `needs:` — no
# cross-workflow polling gate needed.
#
# Each Android product is released on its own (docs/build/RELEASING.md):
#   phototok-vX.Y.Z         builds, signs and publishes only Jackpix
#   android-desktop-vX.Y.Z  builds, signs and publishes only Frameduel
# A tag push builds exactly the module its prefix names, whatever the path
# filter says; `scripts/release.py verify-tag` fails the run before anything
# is built if the tag, the in-tree version and the changelog disagree.

on:
  push:
    branches: [main]
    tags: ["phototok-v*", "android-desktop-v*"]
    paths:
      - 'products/android/**'
      - '.github/workflows/android.yml'
      - 'testdata/formats/**'
      - 'scripts/fetch_format_corpus.py'
      - '.github/actions/format-corpus/**'
  pull_request:
    branches: [main]
    paths:
      - 'products/android/**'
      - '.github/workflows/android.yml'
      - 'testdata/formats/**'
      - 'scripts/fetch_format_corpus.py'
      - '.github/actions/format-corpus/**'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  # Only cancel superseded PR runs; never abort an in-flight main/tag run
  # that may already be publishing to Play or Firebase.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── Module change detection ──────────────────────────────────────
  detect-changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `toolbox` / `phototok` say which module the release steps build and publish:
    # the path filter on branch pushes, exactly the tagged product on a tag push.
    outputs:
      toolbox: ${{ steps.modules.outputs.toolbox }}
      phototok: ${{ steps.modules.outputs.phototok }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            toolbox:
              - 'products/android/android-desktop/**'
              - 'products/android/core/**'
              - 'products/android/saf/**'
              - 'products/android/build.gradle.kts'
              - 'products/android/settings.gradle.kts'
              - 'products/android/gradle.properties'
              - 'products/android/gradle/**'
              - '.github/workflows/android.yml'
            phototok:
              - 'products/android/phototok/**'
              - 'products/android/core/**'
              - 'products/android/saf/**'
              - 'products/android/build.gradle.kts'
              - 'products/android/settings.gradle.kts'
              - 'products/android/gradle.properties'
              - 'products/android/gradle/**'
              - '.github/workflows/android.yml'

      # A tag release is per product: the path filter must not pull the other
      # module into it (and has no meaningful diff on a tag push anyway).
      - name: Resolve modules to build
        id: modules
        env:
          TOOLBOX_CHANGED: ${{ steps.filter.outputs.toolbox }}
          PHOTOTOK_CHANGED: ${{ steps.filter.outputs.phototok }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/android-desktop-v*) toolbox=true;  phototok=false ;;
            refs/tags/phototok-v*)        toolbox=false; phototok=true ;;
            *)                            toolbox="$TOOLBOX_CHANGED"; phototok="$PHOTOTOK_CHANGED" ;;
          esac
          echo "toolbox=$toolbox" >> "$GITHUB_OUTPUT"
          echo "phototok=$phototok" >> "$GITHUB_OUTPUT"

  # ── JVM unit tests (no emulator needed) ─────────────────────────
  unit-tests:
    name: Unit tests (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # setup-gradle handles Gradle caching (writes on main, read-only on
      # branches) — no separate actions/cache step needed.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Real-camera format corpus (docs/shared/SUPPORTED_FORMATS.md): fails the job if it
      # cannot be fetched, and makes the format tests mandatory instead of skippable.
      - name: Format conformance corpus
        uses: ./.github/actions/format-corpus

      - name: Run unit tests
        working-directory: products/android
        run: ./gradlew testDebugUnitTest --stacktrace

      # `testDebugUnitTest` and `lintDebug` never compile `src/androidTest`, so
      # a typo there used to survive every cheap job and only blow up inside the
      # emulator job — where the failure surfaces as a bare
      # "The process '/usr/bin/sh' failed with exit code 1". Building the test
      # APKs here validates the same sources (Kotlin + kapt/Hilt) in ~2 minutes
      # with no emulator, so instrumented-test breakage is reported in plain
      # Kotlin compiler output instead.
      - name: Compile instrumented test sources
        working-directory: products/android
        run: ./gradlew :android-desktop:assembleDebugAndroidTest :phototok:assembleDebugAndroidTest --stacktrace

      - name: Verify 16 KB ELF page alignment (merged native libs)
        run: |
          python3 scripts/check_native_alignment.py \
            products/android/android-desktop/build/intermediates/merged_native_libs/debug \
            products/android/phototok/build/intermediates/merged_native_libs/debug

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: |
            products/android/android-desktop/build/reports/tests/testDebugUnitTest/
            products/android/phototok/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  # ── Android Lint (advisory for now — tighten once baseline is clean) ──
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run lint
        working-directory: products/android
        run: ./gradlew :android-desktop:lintDebug :phototok:lintDebug --continue --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            products/android/android-desktop/build/reports/lint-results-debug.html
            products/android/phototok/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # ── Instrumented tests on Android emulator ──────────────────────
  instrumented-tests:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The emulator job is the slowest and least readable in the pipeline (~15
    # min vs ~2 min). `unit-tests` already compiles :app and :phototok
    # androidTest sources, so gating on it means a Kotlin/KSP break in a test
    # source is reported as plain compiler output in 2 minutes instead of
    # burning a full emulator boot and surfacing as "process '/usr/bin/sh'
    # failed with exit code 1".
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        api-level: [30]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 60
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          # AVD snapshot caching is deliberately not used (see commit cf1baa9 —
          # snapshot/emulator-version mismatches produced flaky boot failures).
          # Without a cached AVD there is nothing to reuse, so this must be
          # `true`; `false` would ask the action to reuse an AVD that never
          # exists and only adds a boot-time lookup.
          force-avd-creation: true
          disable-animations: true
          # `-no-snapshot-save` is what actually prevents the emulator teardown
          # crash. There is no `disable-snapshot` input on this action (v2), so
          # passing it was silently ignored and only produced a CI warning.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -no-snapshot-save -camera-back none
          working-directory: products/android
          script: |
            ./gradlew :android-desktop:connectedDebugAndroidTest :phototok:connectedDebugAndroidTest --stacktrace
            killall -9 crashpad_handler || true

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-report-api${{ matrix.api-level }}
          path: |
            products/android/android-desktop/build/reports/androidTests/connected/
            products/android/phototok/build/reports/androidTests/connected/
          if-no-files-found: ignore

  # ── Build & sign (main / tags / manual dispatch only) ───────────
  #
  # NOTE on workflow_dispatch: the job runs, but every signing/publishing step
  # below is gated on `github.event_name == 'push'`, so a manual dispatch
  # produces the debug APK only — it never signs, uploads to Firebase, or
  # publishes to Play. That is intentional (manual runs are for smoke-checking
  # the build, not for shipping). The conditions used to also carry
  # `|| github.event_name == 'workflow_dispatch'` *inside* the push guard,
  # which could never evaluate true and only made the intent unreadable.
  build:
    name: Build Android
    needs: [unit-tests, instrumented-tests, detect-changes]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/phototok-v') || startsWith(github.ref, 'refs/tags/android-desktop-v')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION_CODE_OFFSET: ${{ vars.VERSION_CODE_OFFSET || 0 }}
      TOOLBOX_VERSION_CODE_OFFSET: ${{ vars.TOOLBOX_VERSION_CODE_OFFSET || 0 }}
      PHOTOTOK_VERSION_CODE_OFFSET: ${{ vars.PHOTOTOK_VERSION_CODE_OFFSET || 0 }}

    steps:
      # Re-running a failed workflow reuses github.run_number, so a plain
      # run_number version code collides on Google Play when an earlier attempt
      # already published ("Version code N has already been used"). Folding in
      # run_attempt makes every attempt unique while staying monotonically
      # increasing across runs (run 78 attempt 1 → 7801, attempt 2 → 7802,
      # run 79 attempt 1 → 7901). Play only requires codes to increase.
      - name: Compute version code
        run: echo "VERSION_CODE=$(( 10000 + ${{ github.run_number }} * 100 + ${{ github.run_attempt }} ))" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v7

      # Release tags only: fail before anything is built or published unless the
      # tag, the in-tree version and the changelog agree. Writes the product,
      # version (bare X.Y.Z) and display name outputs used below.
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        id: verify
        run: python3 scripts/release.py verify-tag "$GITHUB_REF_NAME"

      # The Gradle default versionName already equals the tag (verify-tag checked
      # it); pinning it from the tag as well makes the shipped version impossible
      # to drift from the tag the release is published under.
      - name: Pin version name to the tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_PRODUCT: ${{ steps.verify.outputs.product }}
          RELEASE_VERSION: ${{ steps.verify.outputs.version }}
        run: |
          case "$RELEASE_PRODUCT" in
            phototok)        echo "PHOTOTOK_VERSION_NAME=$RELEASE_VERSION" >> "$GITHUB_ENV" ;;
            android-desktop) echo "TOOLBOX_VERSION_NAME=$RELEASE_VERSION" >> "$GITHUB_ENV" ;;
            *) echo "Unexpected product '$RELEASE_PRODUCT' for tag $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        working-directory: products/android
        run: ./gradlew assembleDebug

      - name: Verify 16 KB ELF and zip-entry alignment (debug APK)
        run: |
          python3 scripts/check_native_alignment.py \
            products/android/android-desktop/build/outputs/apk/debug/*.apk \
            products/android/phototok/build/outputs/apk/debug/*.apk

      # Each app has its own upload keystore (full isolation). Decode both.
      - name: Decode Keystores
        if: github.event_name == 'push'
        env:
          TOOLBOX_KEYSTORE_BASE64: ${{ secrets.TOOLBOX_KEYSTORE_FILE }}
          PHOTOTOK_KEYSTORE_BASE64: ${{ secrets.PHOTOTOK_KEYSTORE_FILE }}
        run: |
          if [ -n "$TOOLBOX_KEYSTORE_BASE64" ]; then
            printf "%s" "$TOOLBOX_KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/products/android/toolbox-upload.jks
            echo "TOOLBOX_KEYSTORE_FILE=${{ github.workspace }}/products/android/toolbox-upload.jks" >> "$GITHUB_ENV"
          else
            echo "Frameduel keystore secret is empty; :android-desktop release will be unsigned."
          fi
          if [ -n "$PHOTOTOK_KEYSTORE_BASE64" ]; then
            printf "%s" "$PHOTOTOK_KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/products/android/phototok-upload.jks
            echo "PHOTOTOK_KEYSTORE_FILE=${{ github.workspace }}/products/android/phototok-upload.jks" >> "$GITHUB_ENV"
          else
            echo "Jackpix keystore secret is empty; :phototok release will be unsigned."
          fi

      - name: Build release APK
        if: github.event_name == 'push'
        working-directory: products/android
        run: |
          TASKS=""
          if [ "${{ needs.detect-changes.outputs.toolbox }}" = "true" ]; then
            TASKS="$TASKS :android-desktop:assembleRelease"
          fi
          if [ "${{ needs.detect-changes.outputs.phototok }}" = "true" ]; then
            TASKS="$TASKS :phototok:assembleRelease"
          fi
          if [ -n "$TASKS" ]; then
            ./gradlew $TASKS
          else
            echo "No module changes detected; skipping release APK builds."
          fi
        env:
          TOOLBOX_KEY_ALIAS: ${{ secrets.TOOLBOX_KEY_ALIAS }}
          TOOLBOX_KEY_PASSWORD: ${{ secrets.TOOLBOX_KEY_PASSWORD }}
          TOOLBOX_STORE_PASSWORD: ${{ secrets.TOOLBOX_STORE_PASSWORD }}
          PHOTOTOK_KEY_ALIAS: ${{ secrets.PHOTOTOK_KEY_ALIAS }}
          PHOTOTOK_KEY_PASSWORD: ${{ secrets.PHOTOTOK_KEY_PASSWORD }}
          PHOTOTOK_STORE_PASSWORD: ${{ secrets.PHOTOTOK_STORE_PASSWORD }}

      - name: Build release AAB
        if: github.event_name == 'push'
        working-directory: products/android
        run: |
          TASKS=""
          if [ "${{ needs.detect-changes.outputs.toolbox }}" = "true" ]; then
            TASKS="$TASKS :android-desktop:bundleRelease"
          fi
          if [ "${{ needs.detect-changes.outputs.phototok }}" = "true" ]; then
            TASKS="$TASKS :phototok:bundleRelease"
          fi
          if [ -n "$TASKS" ]; then
            ./gradlew $TASKS
          else
            echo "No module changes detected; skipping release AAB builds."
          fi
        env:
          TOOLBOX_KEY_ALIAS: ${{ secrets.TOOLBOX_KEY_ALIAS }}
          TOOLBOX_KEY_PASSWORD: ${{ secrets.TOOLBOX_KEY_PASSWORD }}
          TOOLBOX_STORE_PASSWORD: ${{ secrets.TOOLBOX_STORE_PASSWORD }}
          PHOTOTOK_KEY_ALIAS: ${{ secrets.PHOTOTOK_KEY_ALIAS }}
          PHOTOTOK_KEY_PASSWORD: ${{ secrets.PHOTOTOK_KEY_PASSWORD }}
          PHOTOTOK_STORE_PASSWORD: ${{ secrets.PHOTOTOK_STORE_PASSWORD }}

      - name: Prepare Release Assets
        if: github.event_name == 'push'
        run: |
          mkdir -p products/android/release-assets
          if compgen -G "products/android/android-desktop/build/outputs/apk/release/*.apk" > /dev/null; then
            cp products/android/android-desktop/build/outputs/apk/release/*.apk products/android/release-assets/photo-selector-toolbox-android-release.apk
          fi
          if compgen -G "products/android/android-desktop/build/outputs/bundle/release/*.aab" > /dev/null; then
            cp products/android/android-desktop/build/outputs/bundle/release/*.aab products/android/release-assets/photo-selector-toolbox-android-release.aab
          fi
          if compgen -G "products/android/phototok/build/outputs/apk/release/*.apk" > /dev/null; then
            cp products/android/phototok/build/outputs/apk/release/*.apk products/android/release-assets/phototok-android-release.apk
          fi
          if compgen -G "products/android/phototok/build/outputs/bundle/release/*.aab" > /dev/null; then
            cp products/android/phototok/build/outputs/bundle/release/*.aab products/android/release-assets/phototok-android-release.aab
          fi

      - name: Verify 16 KB ELF and zip-entry alignment (release APK & AAB)
        if: github.event_name == 'push'
        run: |
          shopt -s nullglob
          ARCHIVES=(products/android/release-assets/*.apk products/android/release-assets/*.aab)
          if [ "${#ARCHIVES[@]}" -gt 0 ]; then
            python3 scripts/check_native_alignment.py "${ARCHIVES[@]}"
          fi

      # `if-no-files-found` defaults to `warn`, which turns a broken build into
      # a yellow annotation and an empty artifact — and the empty artifact then
      # fails confusingly two jobs later in `publish-play`. Every upload below
      # is guarded by a condition that guarantees the file exists, so `error`
      # is correct: it fails at the step that actually went wrong.
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: photo-selector-toolbox-android-debug
          path: products/android/android-desktop/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: github.event_name == 'push' && needs.detect-changes.outputs.toolbox == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: photo-selector-toolbox-android-release
          path: products/android/release-assets/photo-selector-toolbox-android-release.apk
          if-no-files-found: error

      - name: Upload Jackpix release APK
        if: github.event_name == 'push' && needs.detect-changes.outputs.phototok == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: phototok-android-release
          path: products/android/release-assets/phototok-android-release.apk
          if-no-files-found: error

      # Each app lives in its own Firebase project with its own service-account credential.
      - name: Upload Frameduel to Firebase App Distribution
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.toolbox == 'true'
        # Tester distribution is a convenience and must not block the Play Store
        # release that runs later in this job. The "groups" alias below must exist
        # in the Firebase project, otherwise distribution 404s.
        continue-on-error: true
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          # App ID from the Photo Selector Toolbox Firebase project (photo-selector-tb-dist).
          appId: ${{ vars.TOOLBOX_FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.TOOLBOX_FIREBASE_APP_DISTRIBUTION_CREDENTIALS }}
          # Must match a tester-group ALIAS created in the Firebase Console
          # (App Distribution > Testers & groups). Override via repo variable.
          groups: ${{ vars.TOOLBOX_FIREBASE_TESTER_GROUP || 'testers' }}
          file: products/android/release-assets/photo-selector-toolbox-android-release.apk

      - name: Upload Jackpix to Firebase App Distribution
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.phototok == 'true'
        continue-on-error: true
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ vars.PHOTOTOK_FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.PHOTOTOK_FIREBASE_APP_DISTRIBUTION_CREDENTIALS }}
          # Must match a tester-group ALIAS created in the Firebase Console.
          groups: ${{ vars.PHOTOTOK_FIREBASE_TESTER_GROUP || 'testers' }}
          file: products/android/release-assets/phototok-android-release.apk

      - name: Upload release AAB
        if: github.event_name == 'push' && needs.detect-changes.outputs.toolbox == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: photo-selector-toolbox-android-release-aab
          path: products/android/release-assets/photo-selector-toolbox-android-release.aab
          if-no-files-found: error

      - name: Upload Jackpix release AAB
        if: github.event_name == 'push' && needs.detect-changes.outputs.phototok == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: phototok-android-release-aab
          path: products/android/release-assets/phototok-android-release.aab
          if-no-files-found: error

      - name: Move nightly tag to this commit
        # softprops/action-gh-release never moves an existing tag, so without this the Nightly
        # Build release serves new assets under a tag pinned to an old commit.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.detect-changes.outputs.toolbox == 'true' || needs.detect-changes.outputs.phototok == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true \
            || gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA"

      - name: Publish Release Assets
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && (needs.detect-changes.outputs.toolbox == 'true' || needs.detect-changes.outputs.phototok == 'true')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          files: products/android/release-assets/*

      # A product release: only the tagged module was built, so release-assets
      # holds only that product's APK and AAB. The body is the changelog section
      # for the tagged version.
      - name: Render release notes
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/phototok-v') || startsWith(github.ref, 'refs/tags/android-desktop-v'))
        run: python3 scripts/release.py notes "$GITHUB_REF_NAME" > release-notes.md

      - name: Publish product release
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/phototok-v') || startsWith(github.ref, 'refs/tags/android-desktop-v'))
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.verify.outputs.name }} ${{ steps.verify.outputs.version }}
          body_path: release-notes.md
          prerelease: false
          make_latest: true
          files: products/android/release-assets/*

  publish-play:
    name: Publish to Google Play
    needs: [build, detect-changes]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/phototok-v') || startsWith(github.ref, 'refs/tags/android-desktop-v')) && (needs.detect-changes.outputs.toolbox == 'true' || needs.detect-changes.outputs.phototok == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download Frameduel AAB
        if: needs.detect-changes.outputs.toolbox == 'true'
        uses: actions/download-artifact@v8
        with:
          name: photo-selector-toolbox-android-release-aab
          path: release-assets

      - name: Download Jackpix AAB
        if: needs.detect-changes.outputs.phototok == 'true'
        uses: actions/download-artifact@v8
        with:
          name: phototok-android-release-aab
          path: release-assets

      - name: Upload Frameduel AAB to Google Play
        if: needs.detect-changes.outputs.toolbox == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.TOOLBOX_GP_SERVICE_ACCOUNT_JSON }}
          packageName: com.photoselectortoolbox
          releaseFiles: release-assets/photo-selector-toolbox-android-release.aab
          tracks: internal
          status: completed

      - name: Upload Jackpix AAB to Google Play
        if: needs.detect-changes.outputs.phototok == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PHOTOTOK_GP_SERVICE_ACCOUNT_JSON }}
          packageName: com.phototok
          releaseFiles: release-assets/phototok-android-release.aab
          tracks: internal
          status: completed
