name: CLA

# Contributor License Agreement check (CLA Assistant Lite). External pull requests must sign
# CLA.md once by commenting the sign-off sentence; signatures are stored on the
# `cla-signatures` branch so main stays clean. The maintainer and bots are allow-listed.
# Why: the maintainer must hold the rights to relicense or offer commercial builds later.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/alexpp90/photo-selector/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'alexpp90,google-labs-jules[bot],github-actions[bot],dependabot[bot],*[bot]'
          lock-pullrequest-aftermerge: false
