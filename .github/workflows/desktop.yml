name: Desktop CI

# Single pipeline for the Python/Tkinter desktop solution: lint + tests always
# run; the 3-OS PyInstaller builds, GitHub release, and Homebrew tap update
# only happen on pushes to main or `desktop-vX.Y.Z` tags (and manual dispatch). The legacy
# Desktop is released on its own: a tag for another product does not start this workflow, and
# `scripts/release.py verify-tag` fails the release job unless the tag matches the in-tree
# version and CHANGELOG. Homebrew formulae live only in alexpp90/homebrew-tap, which the last
# job updates. Builds depend on tests via `needs:` — no cross-workflow polling gate needed.

on:
  push:
    branches: [main]
    tags: ["desktop-v*"]
    paths:
      - 'products/desktop/**'
      - '*.spec'
      - 'scripts/**'
      - '.github/workflows/desktop.yml'
      - 'testdata/formats/**'
      - 'scripts/fetch_format_corpus.py'
      - '.github/actions/format-corpus/**'
  pull_request:
    branches: [main]
    paths:
      - 'products/desktop/**'
      - '*.spec'
      - 'scripts/**'
      - '.github/workflows/desktop.yml'
      - 'testdata/formats/**'
      - 'scripts/fetch_format_corpus.py'
      - '.github/actions/format-corpus/**'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  # Only cancel superseded PR runs; never abort an in-flight main/tag run
  # that may already be publishing a release or updating the Homebrew tap.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── Fast lint gate (< 30s) ──────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: products/desktop
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 src/ tests/ --count --show-source --statistics

  # ── Unit & integration tests ────────────────────────────────────
  test:
    name: Tests on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: products/desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            architecture: x64
          - os: macos-latest
            python-version: "3.12"
            architecture: arm64
          - os: windows-latest
            python-version: "3.12"
            architecture: x64

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libcairo2-dev xvfb scrot

      - name: Install Poetry
        run: |
          pip install poetry
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Cache Poetry venv
        uses: actions/cache@v6
        with:
          path: products/desktop/.venv
          key: v2-${{ runner.os }}-poetry-${{ matrix.python-version }}-${{ hashFiles('products/desktop/poetry.lock') }}
          restore-keys: |
            v2-${{ runner.os }}-poetry-${{ matrix.python-version }}-

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Start Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1

      # The coverage threshold is enforced on Linux ONLY, deliberately.
      # tests/conftest.py skips tests by platform (`linux_only`, `mac_only`,
      # `windows_only`) and `gui_required` skips when no display is present, so
      # each OS legitimately executes a different subset and reaches a
      # different coverage number. Applying one threshold to all three made
      # coverage a per-OS lottery: a change could pass on the contributor's Mac
      # and fail `--cov-fail-under` only on the Windows runner, with nothing
      # reproducible locally. Linux runs the largest subset, so it is the
      # authoritative gate; the other OSes still run the full test suite and
      # still fail on any real test failure.
      # Real-camera format corpus (docs/shared/SUPPORTED_FORMATS.md): fails the job if it
      # cannot be fetched, and makes the format tests mandatory instead of skippable.
      - name: Format conformance corpus
        uses: ./.github/actions/format-corpus

      - name: Run tests (excluding visual)
        run: >-
          poetry run pytest
          --tb=short -q
          -o faulthandler_timeout=120
          --junitxml=test-results.xml
          --cov=photo_selector_toolbox
          --cov-report=xml
          ${{ runner.os == 'Linux' && '--cov-fail-under=60' || '' }}
          -m "not visual"
        env:
          DISPLAY: ${{ runner.os == 'Linux' && ':99' || '' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: products/desktop/test-results.xml
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: products/desktop/coverage.xml
          if-no-files-found: ignore

  # ── Visual regression tests (Linux only, real Xvfb rendering) ───
  visual:
    name: Visual regression tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: products/desktop
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libcairo2-dev xvfb scrot

      - name: Install Poetry
        run: |
          pip install poetry
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Cache Poetry venv
        uses: actions/cache@v6
        with:
          path: products/desktop/.venv
          key: v2-${{ runner.os }}-poetry-3.12-${{ hashFiles('products/desktop/poetry.lock') }}
          restore-keys: |
            v2-${{ runner.os }}-poetry-3.12-

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1

      - name: Run visual tests
        run: >-
          poetry run pytest
          tests/visual/
          --tb=short -q
          -o faulthandler_timeout=120
          -m visual
        env:
          DISPLAY: ':99'

      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-test-diffs
          path: products/desktop/tests/visual/diffs/
          if-no-files-found: ignore

  # ── PyInstaller builds (main / tags / manual dispatch only) ─────
  build:
    name: Build on ${{ matrix.os }}
    needs: [test, visual]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/desktop-v')))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: products/desktop
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            architecture: x64
            artifact_name: photo-selector-toolbox-linux-x64
          - os: macos-latest
            architecture: arm64
            artifact_name: photo-selector-toolbox-macos-apple-silicon
          - os: windows-latest
            architecture: x64
            artifact_name: photo-selector-toolbox-windows-x64

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        architecture: ${{ matrix.architecture }}

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk libcairo2-dev

    - name: Install Poetry
      run: |
        pip install poetry
        poetry config virtualenvs.create true
        poetry config virtualenvs.in-project true

    # Same cache key as the test jobs so builds reuse their warm venv cache.
    - name: Cache Poetry venv
      uses: actions/cache@v6
      with:
        path: products/desktop/.venv
        key: v2-${{ runner.os }}-poetry-3.12-${{ hashFiles('products/desktop/poetry.lock') }}
        restore-keys: |
          v2-${{ runner.os }}-poetry-3.12-

    - name: Install dependencies
      run: poetry install --no-interaction --no-root

    - name: Build Executables
      run: poetry run python scripts/build.py

    - name: Create Archive (Unix)
      if: runner.os != 'Windows'
      run: |
        cd dist
        zip -r -y ../${{ matrix.artifact_name }}.zip .

    - name: Create Archive (Windows)
      if: runner.os == 'Windows'
      run: |
        python -c "import shutil; shutil.make_archive('${{ matrix.artifact_name }}', 'zip', 'dist')"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact_name }}
        path: products/desktop/${{ matrix.artifact_name }}.zip
        if-no-files-found: error

  release:
    name: Update Release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/desktop-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v7

      # Fail before anything is published unless the tag, the in-tree version and the
      # CHANGELOG agree. Also yields the release name and the bare X.Y.Z version.
      - name: Verify tag matches version and changelog
        id: release
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/release.py verify-tag "$GITHUB_REF_NAME"

      - name: Render release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/release.py notes "$GITHUB_REF_NAME" > release-notes.md

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Display Downloaded Artifacts
        run: ls -R artifacts

      - name: Move nightly tag to this commit
        # softprops/action-gh-release never moves an existing tag, so without this the Nightly
        # Build release serves new assets under a tag pinned to an old commit.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true \
            || gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA"

      - name: Update GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('{0} {1}', steps.release.outputs.name, steps.release.outputs.version) || 'Nightly Build' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly' }}
          body_path: ${{ startsWith(github.ref, 'refs/tags/') && 'release-notes.md' || '' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: artifacts/*.zip
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}

  update-homebrew-taps:
    name: Update Homebrew Taps
    needs: release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/desktop-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_REF: ${{ github.ref }}
      GH_REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download release artifacts
        run: |
          if [ "${GH_REF}" = "refs/heads/main" ]; then
            TAG_DIR="nightly"
          else
            TAG_DIR="${GH_REF_NAME}"
          fi
          curl -fsSL -o macos.zip "https://github.com/alexpp90/photo-selector/releases/download/${TAG_DIR}/photo-selector-toolbox-macos-apple-silicon.zip"
          curl -fsSL -o linux.zip "https://github.com/alexpp90/photo-selector/releases/download/${TAG_DIR}/photo-selector-toolbox-linux-x64.zip"

      - name: Compute SHA256 hashes
        id: hashes
        run: |
          echo "macos_sha256=$(shasum -a 256 macos.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_sha256=$(shasum -a 256 linux.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Update alexpp90/homebrew-tap
        # The tap repository is the only home of the formulae and casks (the main repository no longer
        # carries Formula/ or Casks/). HOMEBREW_TAP_TOKEN: fine-grained PAT with
        # contents:write on alexpp90/homebrew-tap.
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          MACOS_SHA256: ${{ steps.hashes.outputs.macos_sha256 }}
          LINUX_SHA256: ${{ steps.hashes.outputs.linux_sha256 }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN secret is required to update alexpp90/homebrew-tap"
            exit 1
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          UPDATER="$GITHUB_WORKSPACE/products/desktop/scripts/update_formula.py"

          update_and_push() {
            TAP_DIR="$(mktemp -d)"
            git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/alexpp90/homebrew-tap.git" "${TAP_DIR}"
            cd "${TAP_DIR}"
            if [ "${GH_REF}" = "refs/heads/main" ]; then
              python3 "$UPDATER" --file Casks/photo-selector-toolbox-legacy@nightly.rb \
                --macos-sha256 "${MACOS_SHA256}"
              python3 "$UPDATER" --file Formula/photo-selector-toolbox@nightly.rb \
                --macos-sha256 "${MACOS_SHA256}" \
                --linux-sha256 "${LINUX_SHA256}"
              COMMIT_MSG="Update nightly legacy Desktop hashes"
            else
              # desktop-v0.5.0 -> 0.5.0 (the release job already ran verify-tag on this tag)
              VERSION="${GH_REF_NAME##*-v}"
              python3 "$UPDATER" --file Casks/photo-selector-toolbox-legacy.rb \
                --version-val "${VERSION}" \
                --macos-sha256 "${MACOS_SHA256}"
              python3 "$UPDATER" --file Formula/photo-selector-toolbox.rb \
                --version-val "${VERSION}" \
                --macos-sha256 "${MACOS_SHA256}" \
                --linux-sha256 "${LINUX_SHA256}"
              COMMIT_MSG="Update legacy Desktop to ${VERSION}"
            fi
            git add Casks/ Formula/
            git diff --cached --quiet || git commit -m "${COMMIT_MSG}"
            git push origin HEAD
          }

          for i in 1 2 3 4 5; do
            if (update_and_push); then
              echo "alexpp90/homebrew-tap updated."
              exit 0
            fi
            echo "Attempt $i failed (concurrent tap update?). Retrying in 5 seconds..."
            sleep 5
          done
          echo "::error::Failed to update alexpp90/homebrew-tap after 5 attempts."
          exit 1
        shell: bash
