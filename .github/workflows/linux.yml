name: Linux Desktop CI

# Single pipeline for the native Linux Desktop product (photo_selector_linux).
# Lint, headless unit tests, Debian packaging & APT verification, and — on linux-desktop-vX.Y.Z
# tags (Linux Desktop is released on its own; scripts/release.py) — publishing the signed APT
# repository to alexpp90/apt (GitHub Pages: https://alexpp90.github.io/apt/) and a GitHub release
# carrying the .deb.

on:
  push:
    branches: [main]
    tags: ["linux-desktop-v*"]
    paths:
      - 'products/linux-desktop/**'
      - '.github/workflows/linux.yml'
      - 'testdata/formats/**'
      - 'scripts/fetch_format_corpus.py'
      - '.github/actions/format-corpus/**'
  pull_request:
    branches: [main]
    paths:
      - 'products/linux-desktop/**'
      - '.github/workflows/linux.yml'
      - 'testdata/formats/**'
      - 'scripts/fetch_format_corpus.py'
      - '.github/actions/format-corpus/**'
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  # Cancel superseded PR runs; preserve in-flight main/tag release builds
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── Static Analysis & Lint Gate (Mirror: scripts/run_tests.sh `linux.yml:lint`) ──
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: products/linux-desktop
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203,W503

  # ── Headless Unit Tests (Mirror: scripts/run_tests.sh `linux.yml:test`) ──
  test:
    name: Headless Unit Tests (pytest, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # 3.13 is what Debian 13 (Trixie) ships, the product's target; 3.12 stays as the floor.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    # The suite takes about a minute. A test that blocks on a real GTK main loop must fail the job in
    # minutes (faulthandler below dumps every thread's stack), not sit "pending" for hours.
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: products/linux-desktop
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgirepository1.0-dev libcairo2-dev gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gexiv2-0.10 python3-gi python3-gi-cairo pkg-config xvfb libraw-bin heif-gdk-pixbuf libheif-plugin-libde265
          sudo apt-get install -y libgirepository-2.0-dev || true

      - name: Install dependencies
        run: |
          pip install poetry
          poetry config virtualenvs.options.system-site-packages true
          poetry install --no-interaction

      # Real-camera format corpus (docs/shared/SUPPORTED_FORMATS.md): fails the job if it
      # cannot be fetched, and makes the format tests mandatory instead of skippable.
      - name: Format conformance corpus
        uses: ./.github/actions/format-corpus

      # GTK 4 has no headless backend; widgets need a (virtual) display or the interpreter
      # segfaults (exit 139). Without a display, tests/conftest.py falls back to GTK stubs.
      - name: Run pytest
        env:
          GDK_BACKEND: x11
        run: xvfb-run -a poetry run pytest tests/unit -q --tb=short -o faulthandler_timeout=120 --cov=photo_selector_linux --cov-report=term-missing:skip-covered --cov-fail-under=70

  # ── Debian Packaging & APT Validation (Mirror: scripts/run_tests.sh `linux.yml:package`) ──
  package:
    name: Debian Packaging & APT Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev binutils

      - name: Build package, generate APT repository (unsigned) & verify
        run: bash products/linux-desktop/scripts/package_debian.sh

      # Release tags only: hand the verified .deb to the github-release job.
      - name: Upload .deb
        if: startsWith(github.ref, 'refs/tags/linux-desktop-v')
        uses: actions/upload-artifact@v7
        with:
          name: linux-desktop-deb
          path: products/linux-desktop/dist/apt/pool/main/p/photo-selector-linux/*.deb
          if-no-files-found: error

  # ── Publish the signed APT repository to alexpp90/apt (release tags only) ──
  # Needs secrets: APT_REPO_TOKEN (fine-grained PAT, contents:write on alexpp90/apt) and
  # APT_GPG_PRIVATE_KEY (ASCII-armoured private signing key). Local mirror: none — publishing
  # is credentials-bound by design (docs/build/CI_PARITY.md).
  publish-apt:
    name: Publish APT repository
    needs: [lint, test, package]
    if: startsWith(github.ref, 'refs/tags/linux-desktop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # A tag must match the in-tree version and have a changelog section; refuse to publish otherwise.
      - name: Verify release tag
        run: python3 scripts/release.py verify-tag "$GITHUB_REF_NAME"

      - name: Check publishing secrets
        env:
          APT_REPO_TOKEN: ${{ secrets.APT_REPO_TOKEN }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$APT_REPO_TOKEN" ] || [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "::error::APT_REPO_TOKEN and APT_GPG_PRIVATE_KEY secrets are required to publish to alexpp90/apt"
            exit 1
          fi

      - name: Import signing key
        id: gpg
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"

      - name: Check out alexpp90/apt
        uses: actions/checkout@v7
        with:
          repository: alexpp90/apt
          token: ${{ secrets.APT_REPO_TOKEN }}
          path: apt-repo

      - name: Build, generate and sign repository
        env:
          GPG_KEY_ID: ${{ steps.gpg.outputs.key_id }}
        run: |
          bash products/linux-desktop/scripts/package_debian.sh --apt-dir apt-repo --sign
          gpg --export "$GPG_KEY_ID" > apt-repo/photo-selector-archive-keyring.gpg
          gpg --armor --export "$GPG_KEY_ID" > apt-repo/photo-selector-archive-keyring.asc

      - name: Commit and push
        working-directory: apt-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "APT repository already up to date"
            exit 0
          fi
          git commit -m "Publish photo-selector-linux for ${GITHUB_REF_NAME}"
          git push origin HEAD

  # ── GitHub release with the .deb (release tags only) ──
  github-release:
    name: GitHub release
    needs: [lint, test, package]
    if: startsWith(github.ref, 'refs/tags/linux-desktop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify release tag
        id: tag
        run: python3 scripts/release.py verify-tag "$GITHUB_REF_NAME"

      - name: Release notes
        run: python3 scripts/release.py notes "$GITHUB_REF_NAME" > release-notes.md

      - name: Download .deb
        uses: actions/download-artifact@v8
        with:
          name: linux-desktop-deb
          path: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: "${{ steps.tag.outputs.name }} ${{ steps.tag.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: false
          make_latest: true
          files: release-assets/*.deb
          fail_on_unmatched_files: true
