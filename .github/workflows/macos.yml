name: macOS Desktop CI

# Single pipeline for the native Swift 6 macOS Desktop product (Lensjet).
# Unit, adversarial, and performance tests run on every push and PR touching products/macos-desktop/.
# Release builds and artifact packaging execute on pushes to main or `macos-desktop-v*` tags (and
# manual dispatch). macOS Desktop is released on its own: only a `macos-desktop-vX.Y.Z` tag runs
# this workflow's release path, and `scripts/release.py verify-tag` refuses a tag whose version
# differs from products/macos-desktop/VERSION or that has no CHANGELOG.md section.

on:
  push:
    branches: [main]
    tags: ["macos-desktop-v*"]
    paths:
      - 'products/macos-desktop/**'
      - '.github/workflows/macos.yml'
      - 'products/desktop/scripts/update_formula.py'
      - 'testdata/formats/**'
      - 'scripts/fetch_format_corpus.py'
      - '.github/actions/format-corpus/**'
  pull_request:
    branches: [main]
    paths:
      - 'products/macos-desktop/**'
      - '.github/workflows/macos.yml'
      - 'products/desktop/scripts/update_formula.py'
      - 'testdata/formats/**'
      - 'scripts/fetch_format_corpus.py'
      - '.github/actions/format-corpus/**'
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  # Cancel superseded PR runs; preserve in-flight main/tag release builds
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── Native Swift Test Suite (Mirror: scripts/run_tests.sh `macos.yml:swift-test`) ──
  swift-test:
    name: Swift Tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: products/macos-desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Xcode 16 / Swift 6 Toolchain
        run: |
          echo "=== Available Xcode Installations ==="
          ls -d /Applications/Xcode* 2>/dev/null || true
          
          # Select Xcode 16 if installed at standard runner paths
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          
          echo "Active Xcode: $(xcode-select -p)"
          xcodebuild -version
          swift --version

      - name: Build Lensjet (Release)
        run: swift build -c release

      # The UI test hooks can trash files when launched with --ui-scenario: a release build
      # must not contain them (they are compiled in only for debug and --test-hooks builds).
      - name: Release binary carries no UI test hooks
        run: scripts/check_no_test_hooks.sh .build/release/PhotoSelectorApp

      # Real-camera format corpus (docs/shared/SUPPORTED_FORMATS.md): fails the job if it
      # cannot be fetched, and makes the format tests mandatory instead of skippable.
      - name: Format conformance corpus
        uses: ./.github/actions/format-corpus

      - name: Run Unit, Adversarial & SLA Test Suites (Release)
        run: swift test -c release --no-parallel

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-desktop-test-artifacts
          path: products/macos-desktop/.build/release/PhotoSelectorApp
          if-no-files-found: ignore

  # ── Release Packaging (Main / Tags / Dispatch Only) ──
  build:
    name: Build & Package macOS Binary
    needs: swift-test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/macos-desktop-v')))
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: products/macos-desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify release tag matches products/macos-desktop/VERSION
        # Fail before spending a universal build on a tag that cannot be published.
        if: startsWith(github.ref, 'refs/tags/macos-desktop-v')
        working-directory: .
        run: python3 scripts/release.py verify-tag "$GITHUB_REF_NAME"

      - name: Select Xcode 16 / Swift 6 Toolchain
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version

      - name: Build Application Bundle & Archive
        env:
          # CFBundleShortVersionString comes from products/macos-desktop/VERSION (the tag was
          # verified against it above); CFBundleVersion is the monotonically increasing run number.
          MACOS_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # Universal (arm64 + x86_64): the cask has no arch restriction and the README
          # promises Intel support. The asset keeps its historical name because the
          # alexpp90/homebrew-tap casks download it by that name.
          scripts/build_app.sh release --universal
          scripts/check_no_test_hooks.sh .build/app/Lensjet.app
          cd .build/app
          zip -r -y ../../../../photo-selector-macos-apple-silicon.zip Lensjet.app

      - name: Upload Release Archive
        uses: actions/upload-artifact@v7
        with:
          name: photo-selector-macos-apple-silicon
          path: photo-selector-macos-apple-silicon.zip
          if-no-files-found: error

  # ── GitHub Release (Main / Tags Push Only) ──
  release:
    name: Publish macOS Release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/macos-desktop-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        if: startsWith(github.ref, 'refs/tags/macos-desktop-v')
        uses: actions/checkout@v7

      - name: Verify release tag and read release notes
        id: release_meta
        # Runs before anything is published: a tag that disagrees with VERSION or has no
        # changelog section fails the run here.
        if: startsWith(github.ref, 'refs/tags/macos-desktop-v')
        run: |
          python3 scripts/release.py verify-tag "$GITHUB_REF_NAME"
          python3 scripts/release.py notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: photo-selector-macos-apple-silicon
          path: artifacts

      - name: Move nightly tag to this commit
        # softprops/action-gh-release never moves an existing tag, so without this the Nightly
        # Build release serves new assets under a tag pinned to an old commit.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true \
            || gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA"

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/macos-desktop-v') && steps.release_meta.outputs.name || 'Nightly Build' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/macos-desktop-v') && github.ref_name || 'nightly' }}
          body_path: ${{ startsWith(github.ref, 'refs/tags/macos-desktop-v') && format('{0}/release-notes.md', runner.temp) || '' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/macos-desktop-v') }}
          files: artifacts/*.zip
          make_latest: ${{ startsWith(github.ref, 'refs/tags/macos-desktop-v') && 'true' || 'false' }}

  # ── Homebrew Tap Synchronization ──
  update-homebrew-taps:
    name: Update Homebrew Taps (Native macOS)
    needs: release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/macos-desktop-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_REF: ${{ github.ref }}
      GH_REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download release artifact
        run: |
          if [ "${GH_REF}" = "refs/heads/main" ]; then
            TAG_DIR="nightly"
          else
            TAG_DIR="${GH_REF_NAME}"
          fi
          curl -fsSL -o macos.zip "https://github.com/alexpp90/photo-selector/releases/download/${TAG_DIR}/photo-selector-macos-apple-silicon.zip"

      - name: Compute SHA256 hash
        id: hashes
        run: |
          echo "macos_sha256=$(shasum -a 256 macos.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Update alexpp90/homebrew-tap
        # The tap repository is the only home of the casks (the main repository no longer
        # carries Formula/ or Casks/). HOMEBREW_TAP_TOKEN: fine-grained PAT with
        # contents:write on alexpp90/homebrew-tap.
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          MACOS_SHA256: ${{ steps.hashes.outputs.macos_sha256 }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN secret is required to update alexpp90/homebrew-tap"
            exit 1
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          UPDATER="$GITHUB_WORKSPACE/products/desktop/scripts/update_formula.py"

          update_and_push() {
            TAP_DIR="$(mktemp -d)"
            git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/alexpp90/homebrew-tap.git" "${TAP_DIR}"
            cd "${TAP_DIR}"
            if [ "${GH_REF}" = "refs/heads/main" ]; then
              CASK=Casks/photo-selector-toolbox@nightly.rb
              python3 "$UPDATER" --file "$CASK" \
                --macos-sha256 "${MACOS_SHA256}"
              COMMIT_MSG="Update nightly native macOS cask hash"
            else
              # macos-desktop-v1.2.3 -> 1.2.3 (the release job's verify-tag already proved
              # it equals products/macos-desktop/VERSION)
              VERSION="${GH_REF_NAME##*-v}"
              CASK=Casks/photo-selector-toolbox.rb
              python3 "$UPDATER" --file "$CASK" \
                --version-val "${VERSION}" \
                --macos-sha256 "${MACOS_SHA256}"
              COMMIT_MSG="Update native macOS cask to ${VERSION}"
            fi
            # Since 0.2.0 the zip holds Lensjet.app (was PhotoSelector.app). Only the cask this
            # run points at the new zip gets the new app name, so the other keeps installing.
            perl -pi -e 's/^(\s*app )"PhotoSelector\.app"/$1"Lensjet.app"/' "$CASK"
            git add Casks/
            git diff --cached --quiet || git commit -m "${COMMIT_MSG}"
            git push origin HEAD
          }

          for i in 1 2 3 4 5; do
            if (update_and_push); then
              echo "alexpp90/homebrew-tap updated."
              exit 0
            fi
            echo "Attempt $i failed (concurrent tap update?). Retrying in 5 seconds..."
            sleep 5
          done
          echo "::error::Failed to update alexpp90/homebrew-tap after 5 attempts."
          exit 1
        shell: bash
