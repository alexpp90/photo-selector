name: Repository Hygiene

# Cheap, product-independent gates that guard the public repository itself:
#   - README parity: every product section present, canonical order, no broken images.
#   - Private-overlay guard: the maintainer's AI framework, requirement specs, prompts and
#     agent memory live in a separate private repository (checked out at private/ and
#     linked in locally). Nothing from it may ever be tracked here.
# Mirror: scripts/run_tests.sh "Repository hygiene" section.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: README parity & private-path guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: No private-overlay material tracked
        run: python3 scripts/check_private_paths.py

      - name: Verify README parity
        run: python3 scripts/check_readme_parity.py --check

      # Per-product releases (docs/build/RELEASING.md): every product's version sources agree,
      # it has a changelog, and its workflow triggers on its own release-tag prefix.
      - name: Release metadata consistent
        run: python3 scripts/release.py check

      # Supported-format contract (docs/shared/SUPPORTED_FORMATS.md): the manifest every
      # product's format tests read is well-formed, every required format has a sample, the
      # committed bitmap fixtures match their pinned hashes, and the corpus fetcher works.
      - name: Format contract manifest
        run: python3 scripts/fetch_format_corpus.py --validate

      # UI text budget (docs/shared/UI_TEXT.md): fails for products in `fail` mode in
      # scripts/ui_text_budget.json, reports for the rest.
      - name: UI text budget
        run: python3 scripts/check_ui_text_budget.py

      - name: Format corpus tooling tests
        run: python3 -m unittest discover -s scripts/tests -v
