appId: com.photoselectortoolbox.lab
---
- swipe:
    start: "50%,35%"
    end: "20%,35%"
# The Delete button: expanded in wide layouts, compact in portrait and small windows.
# (`reject_button` was the star bar's Reject, and never exported: Compose keeps the first tag.)
- tapOn:
    id: "delete_button_(expanded|compact)"
# The confirm dialog is its own window, so its test tag is not exported as a resource id;
# while it is open the hierarchy holds only the dialog, so its "Delete" button is unambiguous
# (English or German: the lab devices run German, values-de since decision #34).
- extendedWaitUntil:
    visible:
      text: "Delete|Löschen"
    timeout: 4000
    optional: true
- tapOn:
    text: "Delete|Löschen"
    optional: true
