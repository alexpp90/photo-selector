# Lab: run by scripts/lab before every journey that does not start from a fresh install.
# If the app has no usable folder (fresh .lab install, or an earlier fresh_install journey
# cleared the grant), grant /sdcard/PSTLab/work; then wait until a photo is on screen.
# The first workspace visit after an install shows the screen guide over everything (sidebar
# included), so it is dismissed before and after the folder check. The guide may be paged:
# "Skip" closes it from any page, "Got it" (coach_overlay_dismiss) is on the last page only.
appId: com.photoselectortoolbox.lab
---
- extendedWaitUntil:
    visible:
      id: "image_region"
    timeout: 6000
    optional: true
# Deletions an earlier journey left pending are offered on the next launch ("Uncompleted
# deletions", REQ-AND-LAYOUT.23) in a dialog window, which exports no test tags (only the
# activity's own window does: `dialog_keep_uncompleted_deletions` never matched, 2026-11-05, six
# journeys broke on `sidebar_open_folder` behind it). Frameduel is English-only, so the dialog is
# found by its title and answered by its button's text. "Keep" changes nothing on disk; never
# "Delete now": the pending URIs belong to byte-identical re-staged fixtures, so it could delete a
# fresh one. While the dialog is open the hierarchy holds only the dialog, so "Keep" is unambiguous.
- runFlow:
    when:
      visible:
        text: "Uncompleted deletions"
    commands:
      - tapOn:
          text: "Keep"
- tapOn:
    id: "coach_overlay_(skip|dismiss)"
    optional: true
- runFlow:
    when:
      notVisible:
        id: "image_region"
    commands:
      - tapOn:
          id: "sidebar_open_folder"
      - runFlow: _pick_work_folder.yaml
- extendedWaitUntil:
    visible:
      id: "coach_overlay_(skip|dismiss)"
    timeout: 4000
    optional: true
- tapOn:
    id: "coach_overlay_(skip|dismiss)"
    optional: true
- extendedWaitUntil:
    visible:
      id: "image_region"
    timeout: 20000
