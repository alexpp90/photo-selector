# Rules on top of detekt's defaults (buildUponDefaultConfig). The problems that existed when the
# gate was introduced are in each module's config/detekt-baseline.xml; this file holds only the
# deliberate deviations, each with its reason.
style:
  MagicNumber:
    active: false # Compose layouts and the scoring maths are full of literals that name nothing better than themselves
  ReturnCount:
    active: false # guard clauses are the house style; a function with several early returns is clearer than nested ifs
  MaxLineLength:
    maxLineLength: 160
exceptions:
  TooGenericExceptionCaught:
    active: false # SAF providers and decoders throw anything; the engines catch Exception on purpose and rethrow cancellation
complexity:
  LongMethod:
    excludes: ['**/tests/**', '**/tests-shared/**']
  LargeClass:
    excludes: ['**/tests/**', '**/tests-shared/**']
  TooManyFunctions:
    active: false # a screen's state holder or an engine is one cohesive class however many functions it has
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable'] # Compose functions are PascalCase nouns
    excludes: ['**/tests/**', '**/tests-shared/**'] # test names are sentences in backticks
