appId: com.phototok.lab
---
# Show the EXIF stats. Info is a toggle whose state outlives a journey, so tap it only when the
# stats are hidden. Portrait shows them in the `viewer.info` card; the landscape side panel shows
# them under `landscape_info_exif_button` without a tag of their own, so the fixture's own value
# (every lab fixture is ISO 400) marks them there (2026-10-18: the first phone-landscape run that
# was really landscape stopped at `info_exif_button`).
- runFlow:
    when:
      visible:
        id: "info_exif_button"
      notVisible:
        id: "viewer.info"
    commands:
      - tapOn:
          id: "info_exif_button"
- runFlow:
    when:
      visible:
        id: "landscape_info_exif_button"
      notVisible:
        text: "ISO 400"
    commands:
      - tapOn:
          id: "landscape_info_exif_button"
- runFlow:
    when:
      visible:
        id: "info_exif_button"
    commands:
      - assertVisible:
          id: "viewer.info"
- runFlow:
    when:
      visible:
        id: "landscape_info_exif_button"
    commands:
      - assertVisible:
          text: "ISO 400"
