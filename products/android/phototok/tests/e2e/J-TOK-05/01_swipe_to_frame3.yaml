- runFlow:
    when:
      visible:
        text: "Link both|Beide verknüpfen|Show both, linked|Link actions across both"
    commands:
      - tapOn:
          text: "Link both|Beide verknüpfen|Show both, linked|Link actions across both"
- swipe:
    start: "50%,70%"
    end: "50%,20%"
- swipe:
    start: "50%,70%"
    end: "50%,20%"
