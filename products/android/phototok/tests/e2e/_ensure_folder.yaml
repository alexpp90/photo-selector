# Lab: run by scripts/lab before every journey that does not start from a fresh install.
# Grants /sdcard/PSTLab/work when there is no usable folder, resumes past the landing page,
# and waits until the feed shows a photo.
appId: com.phototok.lab
---
- extendedWaitUntil:
    visible:
      id: "landing_start_browsing_button"
    timeout: 6000
    optional: true
# The landing is one scroll column: logo, sources, recent folders, then "Start browsing". On the
# 5.2" Xperia XA2 both the start button and the "Folder or Cloud" card are below the fold, so
# neither is visible until the column is scrolled (LAB-23, 2026-10-19: every Xperia journey
# flow-broken). With a folder set the app usually resumes straight into the feed, often under a
# dialog window, and a scroll there swipes through photos (2026-10-19, Pixel 4a). So the scrolls
# run only when the landing's hero logo (content description "Logo", the landing's first item,
# visible in every orientation) was on screen first. Never guard them with `when: visible` of
# their own target: they exist for the screen where it is off screen.
- runFlow:
    when:
      visible:
        text: "Logo"
    commands:
      - evalScript: ${output.onLanding = true}
- runFlow:
    when:
      true: ${output.onLanding}
    commands:
      - runFlow:
          when:
            notVisible:
              id: "landing_start_browsing_button"
          commands:
            - scrollUntilVisible:
                element:
                  id: "landing_start_browsing_button"
                centerElement: true
                visibilityPercentage: 100
                timeout: 6000
                optional: true
      # No start button and no "access lost" prompt: no folder yet. The column is now scrolled
      # to its end, so the card is on screen or above it.
      - runFlow:
          when:
            notVisible:
              id: "landing_start_browsing_button"
          commands:
            - runFlow:
                when:
                  notVisible:
                    id: "reselect_folder_button"
                commands:
                  # The card's centre can sit under the navigation bar (Pixel 4a, 2026-10-18): a
                  # tap there opened no picker. Scroll it fully into view first.
                  - scrollUntilVisible:
                      element:
                        id: "landing_custom_folder_card"
                      direction: UP
                      centerElement: true
                      visibilityPercentage: 100
                      timeout: 10000
                  - tapOn:
                      id: "landing_custom_folder_card"
                  - runFlow: _pick_work_folder.yaml
- runFlow:
    when:
      visible:
        id: "reselect_folder_button"
    commands:
      - tapOn:
          id: "reselect_folder_button"
      - runFlow: _pick_work_folder.yaml
- extendedWaitUntil:
    visible:
      id: "landing_start_browsing_button"
    timeout: 20000
    optional: true
- tapOn:
    id: "landing_start_browsing_button"
    optional: true
# Re-opening a folder with photos newer than the last visit asks "N new photos" (Show new /
# Stay); show the new ones so every journey starts from the same frame regardless of the last run.
# Builds from before the concise-copy pass (#782) still say "Start with Newest" / "Link actions
# across both"; the selectors accept both until every branch has it.
# The dialog is its own window, so its test tags are not exported as resource ids
# (testTagsAsResourceId is set on the activity content only); match the app's own text.
- extendedWaitUntil:
    visible:
      text: "Show new|Start with Newest"
    timeout: 4000
    optional: true
- tapOn:
    text: "Show new|Start with Newest"
    optional: true
# First feed visit after an install shows the controls guide over the photo.
- extendedWaitUntil:
    visible:
      id: "controls_guide"
    timeout: 5000
    optional: true
- tapOn:
    id: "gesture_tutorial_got_it"
    optional: true
# A folder with RAW + JPEG pairs asks how to treat them (REQ-TOK-FEATURE.11) in a dialog window
# over the feed, so viewer.photo is not in the hierarchy until it is answered (2026-10-17: J-TOK-05
# never got past this flow). Link the pairs: J-TOK-05 keeps a pair. Matched by its text for the
# same reason as above ("Show both, linked"; the title's "+" is a regex operator).
- extendedWaitUntil:
    visible:
      id: "viewer.photo"
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible:
        text: "Show both, linked|Link actions across both"
    commands:
      - tapOn:
          text: "Show both, linked|Link actions across both"
- extendedWaitUntil:
    visible:
      id: "viewer.photo"
    timeout: 20000
