# Lab: pick /sdcard/PSTLab/work in the system folder picker (DocumentsUI). The lab runner
# pushes every journey's fixture into that one folder, so one persisted grant serves them all.
# Locale-independent: folder names are ours, "Use this folder" and the "Allow" dialog are both
# android:id/button1 (the lab devices run German as well as English).
appId: com.phototok.lab
---
- waitForAnimationToEnd
# Re-opened pickers start inside the last folder; the first breadcrumb is the storage root.
# Folder names are scrolled to the middle and fully into view before the tap: in a small
# window (960x600 dp) the grid stopped with "PSTLab" under the "Use this folder" bar, the tap
# missed, and the search for "work" scrolled the storage root to its end (2026-10-17).
# Near the end of a short list an item cannot be centred and the centred scroll runs out its
# time although the item is fully on screen (Xperia XA2: "PSTLab" third from the end, 2026-10-20);
# the plain scroll after it then finds it.
# The id is a regex: Google's DocumentsUI (com.google.android.documentsui) and AOSP's
# (com.android.documentsui, the Xperia XA2's LineageOS) name it alike; with only Google's id the
# root tap was skipped on the Xperia and "PSTLab" never appeared (2026-10-20).
- tapOn:
    id: "com\\.(google\\.)?android\\.documentsui:id/breadcrumb_text"
    index: 0
    optional: true
- scrollUntilVisible:
    element:
      text: "PSTLab"
    timeout: 15000
    centerElement: true
    visibilityPercentage: 100
    optional: true
- scrollUntilVisible:
    element:
      text: "PSTLab"
    timeout: 15000
    visibilityPercentage: 100
- tapOn:
    text: "PSTLab"
- scrollUntilVisible:
    element:
      text: "work"
    timeout: 15000
    centerElement: true
    visibilityPercentage: 100
    optional: true
- scrollUntilVisible:
    element:
      text: "work"
    timeout: 15000
    visibilityPercentage: 100
- tapOn:
    text: "work"
- tapOn:
    id: "android:id/button1"
- tapOn:
    id: "android:id/button1"
    optional: true
