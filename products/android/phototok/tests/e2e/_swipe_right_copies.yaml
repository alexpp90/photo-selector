# Lab: make swipe right copy to Selection, whatever an earlier journey or a cleared app left.
# The default for phone folders is "★ Favourite" (PhoneSettings.defaultFor), which
# touches no file; J-TOK-03 and J-TOK-05 expect a copy in Selection (2026-10-18: after a
# `pm clear` J-TOK-03 found no copy). The sheet's "Source Preset" edits the "Phone" kind, the
# kind of /sdcard/PSTLab/work. The "Swipe right" group lists Favourite / Copy / Move (the target is
# the Selection folder setting); "Copy" also appears in the left-swipe group further down, so the
# first match (index 0) is the swipe-right one. The Settings button is selected by its tag `settings_button`
# (added by alexpp90/photo-selector#802); builds without it skip this flow and keep whatever
# verb they have. Steps get 30 s: on the Xperia XA2 one tap takes 5-8 s and the scroll to
# "Copy to Selection" ran out of 10 s one step short (2026-10-19).
appId: com.phototok.lab
---
# The swipe verbs and the source tabs are Pro mode settings (a fresh install is Casual, where
# swipe right is ★ Favourite and the rows are hidden): turn Pro mode on first. A freshly opened
# sheet edits the first source tab ("Phone + cloud", the kind of /sdcard/PSTLab/work), so the flow
# no longer taps it (its label has a "+", which a Maestro text regex would need escaped).
- runFlow: _enable_pro_mode.yaml
- runFlow:
    when:
      visible:
        id: "settings_button"
    commands:
      - tapOn:
          id: "settings_button"
      - scrollUntilVisible:
          element:
            text: "Copy|Kopieren"
          centerElement: true
          visibilityPercentage: 100
          timeout: 30000
      - tapOn:
          text: "Copy|Kopieren"
          index: 0
      - back
      - extendedWaitUntil:
          visible:
            id: "viewer.photo"
          timeout: 30000
