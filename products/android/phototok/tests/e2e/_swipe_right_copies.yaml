# Lab: make swipe right copy to Selection, whatever an earlier journey or a cleared app left.
# The default for phone folders is "★ Favourite" (PhoneSettings.defaultFor), which
# touches no file; J-TOK-03 and J-TOK-05 expect a copy in Selection (2026-10-18: after a
# `pm clear` J-TOK-03 found no copy). The sheet's "Source Preset" edits the "Phone" kind, the
# kind of /sdcard/PSTLab/work. The "Swipe right" group lists Favourite / Copy / Move (the target is
# the Selection folder setting); "Copy" also appears in the left-swipe group further down, so the
# first match (index 0) is the swipe-right one. The Settings button is selected by its tag `settings_button`
# (added by alexpp90/photo-selector#802); builds without it skip this flow and keep whatever
# verb they have.
appId: com.phototok.lab
---
- runFlow:
    when:
      visible:
        id: "settings_button"
    commands:
      - tapOn:
          id: "settings_button"
      - scrollUntilVisible:
          element:
            text: "Phone|Telefon"
          centerElement: true
          visibilityPercentage: 100
          timeout: 10000
      - tapOn:
          text: "Phone|Telefon"
      - scrollUntilVisible:
          element:
            text: "Copy|Kopieren"
          centerElement: true
          visibilityPercentage: 100
          timeout: 10000
      - tapOn:
          text: "Copy|Kopieren"
          index: 0
      - back
      - extendedWaitUntil:
          visible:
            id: "viewer.photo"
          timeout: 10000
