[project]
name = "photo-selector-linux"
version = "0.3.0"
description = "High-performance native GNOME photograph culling and selection suite for Debian 13"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Alexander Patz" }
]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Environment :: Wayland",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "PyGObject>=3.48.0; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "flake8>=7.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[project.scripts]
photo-selector-linux = "photo_selector_linux.__main__:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
pythonpath = ["src"]

# Ruff (CI: linux.yml `lint`, local: scripts/run_tests.sh). flake8 stays the style gate; Ruff adds
# the bug-finding rules flake8 lacks (bugbear, comprehensions, redundant statements). Typing
# modernisation (UP) is not enforced: the code base keeps `typing.Optional`/`List`.
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["dist", ".venv"]

[tool.ruff.lint]
select = ["F", "E", "W", "B", "C4", "PIE", "RUF100"]
ignore = [
    "B905",   # zip(strict=) is a style choice here
    "C408",   # dict()/list() calls read better in tests and fixtures
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017"]   # a test may assert "some exception" where the type is not the point

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
files = ["src/photo_selector_linux/core"]
