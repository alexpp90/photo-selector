id: J-AD-02
product: android-desktop
title: Keyboard navigation, move, delete, undo, and frame maximise
fixture: burst-raw-jpeg
configs: [tab-landscape, tab-landscape-kbd, dex-1280x800, dex-on-device, chromebook-window]
fresh_install: false
steps:
  - {maestro: products/android/android-desktop/tests/e2e/J-AD-02/01_wait_ready.yaml}
  - {keys: [DPAD_RIGHT, DPAD_RIGHT]}
  - {checkpoint: moved}
  - {keys: [M]}
  - {wait_ms: 1500}
  - {checkpoint: after-keep}
  - {keys: [FORWARD_DEL]}
  - {maestro: products/android/android-desktop/tests/e2e/J-AD-02/02_confirm_delete.yaml}
  - {checkpoint: after-delete}
  - {maestro: products/android/android-desktop/tests/e2e/J-AD-02/03_tap_undo.yaml}
  - {checkpoint: after-undo}
  - {keys: ["2"]}
  - {checkpoint: maximised}
  - {keys: [ESCAPE]}
# The expectations name the photo the frame showed, not the one two key presses should reach:
# a swallowed first key (AD-11, cause unsettled) made a correct Move read as a blocker.
bind:
  moved: {kept: column_current}
  after-keep: {deleted: column_current}
fs_expect:
  after-keep:
    present: ["Selection/*{kept}"]
    absent: ["{kept}"]
  after-delete:
    # Delete is pending until the snackbar times out or the app finalises it: still on disk.
    present: ["{deleted}"]
layout_expect:
  moved:
    required: [image_region]
    frames: [image_region]
  maximised:
    required: [maximised_frame]
timing_expect:
  moved:
    trend: true
