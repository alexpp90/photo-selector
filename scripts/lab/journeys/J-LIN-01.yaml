id: J-LIN-01
product: linux
title: Linux Desktop 3-Up comparison, keyboard navigation, move, trash, and undo
fixture: burst-jpeg
configs: [fhd, hidpi, small, large-text]
fresh_install: false
# Checkpoints with an fs_expect wait until it holds (up to fs_timeout_ms, default 10 s) before
# they are captured, so file operations need no fixed waits here.
steps:
  - wait_ms: 1000
  - checkpoint: opened
  - keys: ["3"]
  - checkpoint: three-up
  - keys: [Right, Right]
  - checkpoint: moved
  - keys: [m]
  - checkpoint: after-keep
  - keys: [Delete]
  - checkpoint: after-trash
  - keys: [ctrl+z]
  - checkpoint: after-undo
fs_expect:
  after-keep:
    present: ["Selection/DSC_0003.JPG"]
    absent:  ["DSC_0003.JPG"]
  after-trash:
    present: ["Selection/DSC_0003.JPG"]
    absent:  ["DSC_0003.JPG", "DSC_0004.JPG"]
    trashed: ["*DSC_0004.JPG"]
  after-undo:
    present: ["Selection/DSC_0003.JPG", "DSC_0004.JPG"]
    absent:  ["DSC_0003.JPG"]
layout_expect:
  three-up:
    required: [slot_previous, slot_current, slot_next, action_bar]
    frames: [slot_previous, slot_current, slot_next]
