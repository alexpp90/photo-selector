id: J-LIN-03
product: linux
title: Linux Desktop GVFS mount move, trash, and undo
fixture: smoke
configs: [fhd]
fresh_install: false
# Checkpoints with an fs_expect wait until it holds (up to fs_timeout_ms, default 10 s) before
# they are captured, so file operations need no fixed waits here.
steps:
  - wait_ms: 1000
  - checkpoint: gvfs-opened
  - keys: [m, Delete, ctrl+z]
  - checkpoint: gvfs-after-cull
fs_expect:
  gvfs-after-cull:
    present: ["Selection/DSC_0001.JPG", "DSC_0002.JPG"]
    absent:  ["DSC_0001.JPG"]
layout_expect:
  gvfs-opened:
    required: [slot_current, action_bar]
