id: J-TOK-03
product: phototok
title: Horizontal swipe actions, delete confirmation, revert, and selection viewer
fixture: smoke
configs: [phone-portrait]
fresh_install: false
steps:
  # Swipe right must copy (the phone-folder default is ★ Favourite, which touches no file).
  - {maestro: products/android/phototok/tests/e2e/_swipe_right_copies.yaml}
  - {maestro: products/android/phototok/tests/e2e/J-TOK-03/01_swipe_right_keep.yaml}
  - {wait_ms: 1000}
  - {checkpoint: kept}
  - {maestro: products/android/phototok/tests/e2e/J-TOK-03/02_swipe_left_delete.yaml}
  - {checkpoint: delete-confirm}
  - {maestro: products/android/phototok/tests/e2e/J-TOK-03/03_confirm_delete.yaml}
  - {checkpoint: deleted}
  - {maestro: products/android/phototok/tests/e2e/J-TOK-03/04_revert_delete.yaml}
  - {checkpoint: reverted}
  - {maestro: products/android/phototok/tests/e2e/J-TOK-03/05_delete_and_open_selection.yaml}
  - {wait_ms: 1000}
  - {checkpoint: selection}
fs_expect:
  kept:
    present: ["*Selection*DSC_*.JPG"]
  reverted:
    present: ["DSC_0011.JPG"]
  selection:
    absent: ["DSC_0011.JPG"]
layout_expect:
  deleted:
    required: [viewer_revert_button]
  reverted:
    required: [viewer.photo]
timing_expect:
  kept:
    trend: true
