id: J-TOK-04
product: phototok
title: Backgrounding and rotation with pending delete
fixture: smoke
configs: [phone-portrait]
fresh_install: false
steps:
  - {checkpoint: start}
  - {maestro: products/android/phototok/tests/e2e/J-TOK-04/01_swipe_left_and_confirm.yaml}
  - {background: 5000}
  - {maestro: products/android/phototok/tests/e2e/J-TOK-04/02_assert_revert_visible.yaml}
  - {checkpoint: returned}
  - {rotate: landscape}
  - {checkpoint: landscape}
  - {rotate: portrait}
# The pending delete is of the photo the resumed feed showed, not of DSC_0012: with a fixed
# name a journey that started elsewhere checked a photo it never deleted (LAB-22).
bind:
  start: {deleted: viewer.photo}
fs_expect:
  start:
    unchanged: true
  returned:
    present: ["{deleted}"]
layout_expect:
  returned:
    required: [viewer_revert_button]
  landscape:
    required: [viewer.photo]
timing_expect:
  returned:
    trend: true
