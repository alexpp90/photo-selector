id: J-TOK-05
product: phototok
title: Swipe right on burst folder with RAW and JPEG files
fixture: burst-raw-jpeg
configs: [phone-portrait]
fresh_install: false
steps:
  - {maestro: products/android/phototok/tests/e2e/J-TOK-05/01_swipe_to_frame3.yaml}
  - {checkpoint: frame3}
  - {maestro: products/android/phototok/tests/e2e/J-TOK-05/02_keep.yaml}
  - {wait_ms: 1500}
  - {checkpoint: kept-pair}
# The feed's order (newest first) decides which photo is third; keep whichever the app showed.
bind:
  frame3: {kept: viewer.photo}
fs_expect:
  kept-pair:
    present: ["*Selection*{kept}"]
layout_expect:
  frame3:
    required: [viewer.photo]
  kept-pair:
    required: [viewer.photo]
timing_expect:
  kept-pair:
    trend: true
