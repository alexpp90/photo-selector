id: J-TOK-07
product: phototok
title: Delete then undo shows feedback, at normal and large text (F-TOK missing-feedback class)
fixture: smoke
configs: [phone-large-text, phone-portrait]
fresh_install: false
# First hardware run 2026-11-13: the `deleted` capture came 3.4-4.6 s after the confirm flow
# ended, past the Short snackbar (~4 s), on all three phones. The snackbar is now asserted by the
# confirm flow itself, right after the tap (J-TOK-07/01_confirm_delete_sees_feedback.yaml); the
# checkpoint keeps the Undo button and the file-system verdicts.
steps:
  - {checkpoint: before}
  - {maestro: products/android/phototok/tests/e2e/J-TOK-03/02_swipe_left_delete.yaml}
  - {maestro: products/android/phototok/tests/e2e/J-TOK-07/01_confirm_delete_sees_feedback.yaml}
  - {checkpoint: deleted}
  - {maestro: products/android/phototok/tests/e2e/J-TOK-03/04_revert_delete.yaml}
  - {checkpoint: reverted}
# The delete is deferred (PhoneModeViewModel.finalizePendingDelete): the file is still on disk
# at both checkpoints, and Undo brings the photo back into the feed.
bind:
  before: {victim: viewer.photo}
fs_expect:
  before:
    unchanged: true
  deleted:
    present: ["{victim}"]
  reverted:
    present: ["{victim}"]
layout_expect:
  before:
    required: [viewer.photo]
  deleted:
    required: [viewer_revert_button]
  reverted:
    required: [viewer.photo]
