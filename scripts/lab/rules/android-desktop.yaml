min_target: 48
overlay_ids:
  - gesture_tutorial_overlay
  - selector_coach_overlay
  - coach_callout
  - neighbour_overlay
  - composition_overlay_canvas
  - composition_overlay_container
  - selector_snackbar
  # The first-run pill may sit inside a frame (REQ-AND-LAYOUT.17); what it must not cover is
  # listed under guidance_must_not_cover.
  - first_run_hint
  - first_run_hint_dismiss
frame_ids:
  - image_region
  - maximised_frame
  - selector.frame.current
  - selector.frame.previous
  - selector.frame.next
ignore_ids: []
# By-design overlaps ([a, b] id globs; a node matches through itself or an ancestor). The
# maximise badge sits on its frame, and the rating pill on the maximised frame. The badge is
# not an overlay: exempting it hid the first-run pill covering it (AD-4).
allowed_overlaps:
  - [maximise_badge, "column_*"]
  - [maximise_badge, "selector.frame.*"]
  - [maximise_badge, maximised_frame]
  - [maximise_badge, image_region]
  - [star_rating_bar, maximised_frame]
guidance_must_not_cover:
  first_run_hint: [maximise_badge]
frame_size:
  tab-landscape:
    min_w: 590
    min_h: 440
    ids:
      - image_region
