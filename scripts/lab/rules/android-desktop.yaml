min_target: 48
overlay_ids:
  - gesture_tutorial_overlay
  - selector_coach_overlay
  - coach_callout
  - neighbour_overlay
  - composition_overlay_canvas
  - composition_overlay_container
  - selector_snackbar
  # The first-run pill may sit inside a frame (REQ-AND-LAYOUT.17); what it must not cover is
  # listed under guidance_must_not_cover.
  - first_run_hint
  - first_run_hint_dismiss
frame_ids:
  - image_region
  - maximised_frame
  - selector.frame.current
  - selector.frame.previous
  - selector.frame.next
ignore_ids: []
# By-design overlaps ([a, b] id globs; a node matches through itself or an ancestor). The
# maximise badge sits on its frame, the rating pill and the info toggle on the maximised frame
# (REQ-AND-LAYOUT.06: the toggle sits ON the frame, 9378f7da; J-AD-02 `maximised` reported the
# pair twice on 2026-11-05). The badge is not an overlay: exempting it hid the first-run pill
# covering it (AD-4).
allowed_overlaps:
  - [maximise_badge, "column_*"]
  - [maximise_badge, "selector.frame.*"]
  - [maximise_badge, maximised_frame]
  - [maximise_badge, image_region]
  - [star_rating_bar, maximised_frame]
  - [maximised_info_toggle, maximised_frame]
guidance_must_not_cover:
  first_run_hint: [maximise_badge]
frame_size:
  tab-landscape:
    min_w: 590
    min_h: 440
    ids:
      - image_region
# Feedback after an action (scripts/lab/lab/feedback.py): Frameduel's one snackbar card,
# `selector_snackbar` (SelectorActions.kt), also over the fullscreen viewer. Words:
# `SelectionActionLabels.confirmation` ("Moved to Selection", "Copied to «Keepers › Selection»")
# and the delete hint ("Deleted — undo …"). A rating's success has no snackbar (only a failed
# write does), and undo's only when it had to rename or could not remove the copy.
feedback:
  surfaces: [selector_snackbar]
  ignore_ids: [snackbar_undo]
  actions:
    delete: [Deleted]
    copy: [Copied]
    move: [Moved]
text_truncation:
  allow_ids: []
  allow_text: []
