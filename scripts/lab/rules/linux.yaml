min_target: 24
overlay_ids:
  - info_hud
frame_ids:
  - slot_current_image
  - slot_previous_image
  - slot_next_image
ignore_ids: []
frame_size:
  fhd:
    min_w: 350
    min_h: 240
    ids:
      - slot_current
# Feedback after an action (scripts/lab/lab/feedback.py): Blitzlens answers in an Adw.Toast
# (`window.py: show_toast`), which the lab's tree does not contain (`lab_hooks.py` exports only
# widgets with a custom name, and the toast's label has none). Until it is named there is no
# surface to look at: an `expect_feedback` on Linux reports `feedback-unchecked`, never a pass.
feedback:
  surfaces: []
text_truncation:
  allow_ids: []
  allow_text: []
