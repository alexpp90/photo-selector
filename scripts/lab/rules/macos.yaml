min_target: 24
overlay_ids:
  - zoom_exit_pill
  - zoom_exit_button
frame_ids:
  - single_image_viewport
  - slot_current_image
  - slot_previous_image
  - slot_next_image
ignore_ids: []
frame_size:
  w1440:
    min_w: 400
    min_h: 250
    ids:
      - slot_current
# Feedback after an action (scripts/lab/lab/feedback.py): Lensjet's action toast is tagged
# `action_toast` (CullingHUDView, `SlotOverlayLayer`), drawn for 1.2 s. The lab's tree has frames
# only, no text, so the oracle sees that a toast is up but not what it says.
feedback:
  surfaces: [action_toast]
  text: false
text_truncation:
  allow_ids: []
  allow_text: []
