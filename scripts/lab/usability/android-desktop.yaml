# Frameduel (Android Desktop) usability scenarios — reviewed by persona panel.
#
# Covers large-screen tablet & DeX workflows (UC-4, UC-5, UC-6, UC-13, UC-16).
# Scenarios execute in order sharing the app's settings and folder grant; `fresh_start` relaunches
# the app before each scenario after the first (no snackbar or dialog of the last one survives).
product: android-desktop
fresh_start: true
app_id: com.photoselectortoolbox.lab
# Walked in this orientation, verified on the display; the original rotation is restored after.
orientation: landscape
fixture:
  kind: scenes
  remote: /sdcard/PSTLab/usability-trip
scenarios:
  - id: U-AD-01
    title: First launch & 3-Up burst culling with keyboard
    goal: You opened Frameduel on your tablet with keyboard attached. Open the trip shoot and cull the first burst using keyboard shortcuts.
    use_case: UC-4
    steps:
      - launch: {clear: true}
      - screen: welcome
        intent: Understand how to start culling my trip photos
        expected: Tap 'Open Folder' button or press Ctrl+O
      - tap: {text: [Open Folder, Ordner öffnen], label: Open Folder}
      - screen: picker
        system: true
        intent: Locate the trip folder
        expected: Open PSTLab and select usability-trip
      - tap: {text: PSTLab, scroll: true}
      - tap: {text: usability-trip, scroll: true}
      - screen: picker-folder
        system: true
        intent: Confirm selection of usability-trip
        expected: Tap 'Use this folder'
      - tap: {id: button1, label: Use this folder}
      # Android 16 (Moto G77) opens the folder straight after 'Use this folder', with no Allow
      # dialog: the screen and the tap happen only when the dialog shows (2026-11-13 lab run).
      - screen: picker-allow
        system: true
        when: {id: button1, timeout_ms: 4000}
        intent: Grant folder storage permission
        expected: Tap 'Allow'
      - optional_tap: {id: button1, label: Allow}
      # The first visit shows the six-page screen guide over everything (SelectorCoachOverlay).
      - screen: screen-guide
        when: {id: coach_overlay_skip, timeout_ms: 15000}
        intent: Get to my photos and understand what is on this screen
        expected: Page through with Next, or tap Skip to start culling
      - optional_tap: {id: coach_overlay_skip, label: Skip}
      - wait_for: {id: control_block, timeout_ms: 15000}
      - screen: selector-first
        intent: Review first photo in 3-Up one-over-two layout
        expected: Compare current top frame with neighbours and press Right arrow
      - key: Right
      - screen: selector-burst
        intent: This frame is worth keeping, move it to Selection
        expected: Press M to move to Selection
      - key: M
      - screen: after-move
        intent: Notice next frame is blurry, reject it
        expected: Press Delete or Backspace
      - key: Delete
      - screen: delete-confirm
        intent: Confirm deletion of blurry frame
        expected: Tap 'Delete' in confirmation dialog
      # A dialog is its own window and exports no test tags: its button by its text.
      - tap: {text: [Delete, Löschen], label: Delete}
      - screen: after-delete
        intent: Check that next candidate advances automatically
        expected: Press Right arrow to inspect next series

  - id: U-AD-02
    title: Couch tablet touch culling
    goal: Cull weekend photos on the couch with tablet in hand, using touch targets and filmstrip.
    use_case: UC-5
    steps:
      # A delete of an earlier scenario leaves held deletes; the relaunch asks about them in its own
      # Dialog window (text only, no tags reach it). Keep them, so the fixture stays whole.
      - screen: pending-deletions
        when: {text: [Uncompleted deletions, Offene Löschungen], timeout_ms: 4000}
        intent: Decide what happens to the photos I deleted last time
        expected: Tap 'Keep'
      - optional_tap: {text: [Keep, Behalten], label: Keep}
      - screen: touch-selector
        intent: Compare frames comfortably using touch
        expected: Tap 'Next' (rail_next) button
      - tap: {id: rail_next, label: Next}
      - screen: touch-burst-comparison
        intent: Compare the current frame with neighbours
        expected: Tap 'Move' button to file the keeper
      - tap: {id: move_button_expanded, label: Move}
      - screen: touch-after-move
        intent: Check undo notification and toggle candidate filmstrip
        expected: Tap filmstrip toggle button
      - set_state: {id: filmstrip_toggle, on: true, label: Filmstrip}
      - screen: filmstrip-visible
        intent: See thumbnail strip along bottom
        expected: Tap the details toggle to hide the photo details
      # Details are on by default (SettingsRepository `?: true`); the toggle is a switch whose
      # checked state is read from the tree, so this sets it off whatever it was, never flips blind.
      - set_state: {id: details_toggle, on: false, label: Photo details}
      - screen: details-overlay-visible
        intent: See the frames without the details cards
        expected: Dismiss details toggle or proceed

  - id: U-AD-03
    title: Learn Workstation — Explore & Photo Coach
    goal: Open the Learn workstation to understand exposure technique and read Photo Coach guidance.
    use_case: UC-6
    steps:
      # A delete of an earlier scenario leaves held deletes; the relaunch asks about them in its own
      # Dialog window (text only, no tags reach it). Keep them, so the fixture stays whole.
      - screen: pending-deletions
        when: {text: [Uncompleted deletions, Offene Löschungen], timeout_ms: 4000}
        intent: Decide what happens to the photos I deleted last time
        expected: Tap 'Keep'
      - optional_tap: {text: [Keep, Behalten], label: Keep}
      - screen: before-learn
        intent: Open Learn workstation for selected photo
        expected: Press L or tap 'Learn' in sidebar
      - key: L
      - wait_for: {id: learn_tab_explore, timeout_ms: 6000}
      # Learn opens on the Debrief tab since #942; the Photo Coach is on the Photo tab.
      - tap: {id: learn_tab_explore, label: Photo}
      - screen: learn-explore
        intent: Read exposure feedback and technical facts
        expected: Read Photo Coach advice and scroll down
      - swipe: up
      - screen: learn-coach-details
        intent: Review reciprocal shutter speed rule and noise critique
        expected: Rate the photo or explore composition guides

  - id: U-AD-04
    title: Learn Workstation — Composition Overlays & Crop
    goal: Evaluate framing using Rule of Thirds and Golden Spiral overlays, then inspect suggested crop.
    use_case: UC-6
    steps:
      # A delete of an earlier scenario leaves held deletes; the relaunch asks about them in its own
      # Dialog window (text only, no tags reach it). Keep them, so the fixture stays whole.
      - screen: pending-deletions
        when: {text: [Uncompleted deletions, Offene Löschungen], timeout_ms: 4000}
        intent: Decide what happens to the photos I deleted last time
        expected: Tap 'Keep'
      - optional_tap: {text: [Keep, Behalten], label: Keep}
      # Each scenario relaunches onto the culling desk (#933); open Learn and its Photo tab, where
      # the composition guides are (Learn opens on the Debrief tab since #942).
      - key: L
      - wait_for: {id: learn_tab_explore, timeout_ms: 6000}
      - tap: {id: learn_tab_explore, label: Photo}
      - wait_for: {id: toggle_golden_ratio, timeout_ms: 6000}
      - screen: learn-composition-start
        intent: Turn on composition guides to check subject balance
        expected: The Thirds grid is on from the start (it is a Learn default); read it on the photo
      # No tap: the Thirds button exposes no state in the tree, and a tap on the default turns the grid off.
      - screen: learn-thirds-active
        intent: Check alignment with Rule of Thirds grid
        expected: Tap 'Phi' for Golden Ratio grid
      - tap: {id: toggle_golden_ratio, label: Phi}
      - screen: learn-phi-active
        intent: Check Golden Ratio lines, then switch to Fibonacci spiral
        expected: Tap 'Spiral'
      - tap: {id: toggle_spiral, label: Spiral}
      - screen: learn-spiral-active
        intent: Check Golden Spiral orientation and flip focal eye
        expected: Tap spiral flip badge
      - tap: {id: toggle_spiral_flip, label: Flip Spiral}
      - screen: learn-spiral-flipped
        intent: See re-oriented spiral focal eye on subject
        expected: Tap the back arrow at the top left, or press L, to return to culling
      - tap: {id: back_to_cull_button, label: the back arrow}

  - id: U-AD-05
    title: Learn Workstation — Lessons, Debrief & Worked Pair
    goal: Browse interactive photography lessons, read the shoot debrief and open a worked pair.
    use_case: UC-6
    steps:
      # A delete of an earlier scenario leaves held deletes; the relaunch asks about them in its own
      # Dialog window (text only, no tags reach it). Keep them, so the fixture stays whole.
      - screen: pending-deletions
        when: {text: [Uncompleted deletions, Offene Löschungen], timeout_ms: 4000}
        intent: Decide what happens to the photos I deleted last time
        expected: Tap 'Keep'
      - optional_tap: {text: [Keep, Behalten], label: Keep}
      - key: L
      - wait_for: {id: learn_tab_lessons, timeout_ms: 6000}
      - tap: {id: learn_tab_lessons, label: Lessons}
      - screen: learn-lessons-catalog
        intent: Select a photography technique micro-lesson
        expected: Tap a lesson card or switch to the Debrief tab
      - tap: {id: learn_tab_debrief, label: Debrief}
      # The debrief needs the folder's scan; this walk scans only in U-AD-06, so start it here with
      # the debrief's own Scan button when it offers one (it scans in place).
      - screen: debrief-not-scanned
        when: {id: debrief_scan, timeout_ms: 4000}
        intent: See what this shoot taught me
        expected: Tap 'Scan' to analyse the photos
      - optional_tap: {id: debrief_scan, label: Scan}
      - wait_for: {id: debrief_open_pair, timeout_ms: 120000}
      - screen: learn-debrief
        intent: Read the shoot debrief
        expected: Tap 'Worked pair' on a card
      - tap: {id: debrief_open_pair, label: Worked pair}
      - screen: learn-compare-view
        intent: Answer which of two frames of one scene is better, then see why
        expected: Pick A or B, then Show me, then return to culling
      - key: Escape

  - id: U-AD-06
    title: Worst-first sharpness sweep
    goal: Triage the shoot by sorting blurriest photos first to quickly eliminate technical misses.
    use_case: UC-13
    steps:
      # A delete of an earlier scenario leaves held deletes; the relaunch asks about them in its own
      # Dialog window (text only, no tags reach it). Keep them, so the fixture stays whole.
      - screen: pending-deletions
        when: {text: [Uncompleted deletions, Offene Löschungen], timeout_ms: 4000}
        intent: Decide what happens to the photos I deleted last time
        expected: Tap 'Keep'
      - optional_tap: {text: [Keep, Behalten], label: Keep}
      - screen: selector-before-menu
        intent: Open sidebar menu to change sort order
        expected: Tap menu button
      - tap: {id: sidebar_more, label: Menu}
      - screen: overflow-menu
        intent: Select worst-first sharpness sort
        expected: Tap 'Scan images' first (the sort is greyed out until the photos are scanned), then 'Blurriest first'
      # The sort and "Clear scores" stay disabled until the photos are scanned.
      - tap: {text: [Scan images, Bilder scannen], label: Scan images}
      - screen: scan-configuration
        intent: Get the photos analysed so I can sort by sharpness
        expected: Keep the analysis types and tap 'Start Scan'
      - tap: {text: [Start Scan, Scan starten], label: Start Scan}
      - wait_ms: 15000
      - tap: {id: sidebar_more, label: Menu}
      - tap: {text: [Blurriest first, Unschärfste zuerst], label: Blurriest first}
      - screen: worst-first-active
        intent: Review blurriest photo at front of triage queue
        expected: Press Delete to trash out-of-focus frame
      - key: Delete
      # A dialog is its own window and exports no test tags: its button by its text.
      - tap: {text: [Delete, Löschen], label: Delete}
      - screen: worst-first-next
        intent: Confirm triage advances to next blurriest frame
        expected: Continue sweep until stop threshold
