# Blitzlens (Linux Desktop) usability scenarios — reviewed by the persona panel.
#
# The lab session (tests/e2e/session.sh) has no click and no wait-for-element, so every step is
# a key press or a wait (LinuxDriver.translate refuses anything else). Each scenario is a fresh
# launch on the run's copy of the roll, opened at start; Delete goes to the session's private
# trash. The first photo decodes asynchronously, so every screen follows a short wait.
#
# Not covered: a sort order (UC-13: no key, menu or preference reaches the lowest-sharpness sort),
# the file chooser (Ctrl+O), an SD card (UC-10) and a remote mount (UC-17), which a local
# fixture cannot stage. Statistics, duplicates and shortcuts open windows the keyboard cannot
# close (no window manager in the session), so they end their scenario. Blitzlens is
# English-only; `--font-scale` captures a larger-text variant (session text scaling).
product: linux
app_id: app.alpatix.Blitzlens
fixture:
  kind: scenes
  remote: /tmp/pstlab/usability-trip
scenarios:
  - id: U-LIN-01
    title: Burst culling in 3-Up with the keyboard
    goal: Last week's trip photos are open. Compare the three shots of the dawn burst side by side, keep the best one, bin a bad one, and change your mind about it.
    use_case: UC-4
    steps:
      - launch: {}
      - screen: first-photo
        intent: See which photo is open and how many there are
        expected: Press 3 to compare the photo with its neighbours (3-Up)
      - key: "3"
      - wait_ms: 1500
      - screen: three-up
        intent: Compare this shot with the one before and the one after
        expected: Press Right (or L) to step to the next photo
      - key: Right
      - wait_ms: 1500
      - screen: burst-compared
        intent: Decide which shot of the burst is the sharpest
        expected: Press M to move the best shot to Selection
      - key: M
      - wait_ms: 1500
      - screen: after-keep
        intent: Check that the keeper was filed and the counts changed
        expected: Press Delete to send a blurry shot to the Trash
      - key: Delete
      - wait_ms: 1500
      - screen: after-trash
        intent: Make sure the blurry shot is gone
        expected: Press Ctrl+Z to take the last action back
      - key: Ctrl+Z
      - wait_ms: 1500
      - screen: after-undo
        intent: Make sure the shot is back and the counts match
        expected: Press C to copy this shot to Selection and keep the original
      - key: C
      - wait_ms: 1500
      - screen: after-copy
        intent: Check the copy was made and the photo is still in the folder
        expected: Press Right (or L) to carry on with the next photo

  - id: U-LIN-02
    title: Keep a photo together with its RAW file and sidecar
    goal: The first photo of the shoot was shot RAW plus JPEG and has a settings file next to it. Move it and put it back, and check the screen tells you what happened to every file.
    use_case: UC-4
    steps:
      - launch: {}
      - screen: first-photo-with-companions
        intent: Find out whether this photo has other files with it
        expected: The badges above the photo show its RAW and sidecar; press M to move them all to Selection
      - key: M
      - wait_ms: 1500
      - screen: after-move
        intent: Check the screen says what was moved
        expected: The bar at the bottom confirms the move; press Ctrl+Z to put everything back
      - key: Ctrl+Z
      - wait_ms: 1500
      - screen: after-undo
        intent: Make sure the photo and its files are back
        expected: Press I to hide or show the photo details
      - key: I
      - wait_ms: 500
      - screen: info-toggled
        intent: Read the photo details without covering the picture
        expected: Press I again to bring the details back

  - id: U-LIN-03
    title: Library statistics
    goal: Get an overview of the whole shoot — formats, lenses, how sharp it is.
    use_case: UC-14
    steps:
      - launch: {}
      - screen: first-photo
        intent: Find a way to see numbers for the whole shoot
        expected: Press Ctrl+L to open Library Statistics (also in the main menu)
      - key: Ctrl+L
      - wait_ms: 2000
      - screen: library-statistics
        intent: Read how many photos there are, which formats and lenses, and how sharp they are
        expected: The statistics window lists the summary, formats, focal lengths and sharpness by aperture and shutter speed
