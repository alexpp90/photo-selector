# Lensjet (macOS Desktop) usability scenarios — reviewed by the persona panel.
#
# Every step is one the headless UI scenario runner can execute (MacOsDriver.translate refuses
# anything else): keys from UITestDriver.Key, taps and waits on registered frame ids
# (uiTestFrame), Escape to close sheets. Each scenario is a fresh launch on the run's copy of the
# roll, already opened with --open. Delete moves a file to the account's real Trash, so every
# Delete is followed by Cmd+Z in the same scenario. The action toast shows for 1.2 s
# (CullingWorkspaceViewModel.showToast), so a screen after an action waits only 300 ms.
#
# Not reachable headless, so not covered here: the folder picker (Cmd+O opens a modal
# NSOpenPanel), a sort order (UC-13: nothing in the app calls the lowest-sharpness sort), an SD
# card (UC-10) and a cloud folder (UC-17), which a local fixture cannot stage. Lensjet has no
# translation and no text scaling, so there is one capture per run (en@1.0).
product: macos
app_id: app.alpatix.lensjet
fixture:
  kind: scenes
  remote: /tmp/pstlab/usability-trip
scenarios:
  - id: U-MAC-01
    title: Compare a burst in 3-Up and cull with the keyboard
    goal: Last week's trip shoot is open. Line up the three shots of the dawn burst, keep the sharp one, reject the one that missed focus, and change your mind about the rejection.
    use_case: UC-4
    steps:
      - launch: {}
      - key: "3"
      - wait_for: {id: slot_current, timeout_ms: 10000}
      - screen: three-up-first
        intent: See the first photo big and find out how to compare it with the next shots
        expected: Focus 3-Up (key 3) shows the current photo on top and its neighbours below; Right steps on
      - key: Right
      - screen: burst-middle
        intent: Judge this shot against the one before and the one after
        expected: Previous bottom-left, next bottom-right; I shows the exposure details
      - key: I
      - screen: burst-info-toggled
        intent: Hide the details to see more of the pictures while I compare
        expected: I hides the details strip under each photo (it is on by default); I again brings it back
      - key: Right
      - screen: burst-missed
        intent: This frame missed focus; get rid of it
        expected: Delete (or the Trash button in the bottom bar) moves it to the Trash
      - key: Delete
      - wait_ms: 300
      - screen: after-trash
        intent: Be sure the photo is gone and see my running count
        expected: A toast says it went to the Trash; the bottom bar counts one trashed
      - key: Cmd+Z
      - wait_ms: 300
      - screen: after-undo
        intent: I changed my mind; bring it back
        expected: Cmd+Z (or Undo in the bottom bar) restores the photo and the count drops back
      - key: Left
      - key: Left
      - key: Left
      - key: M
      - wait_ms: 300
      - screen: keeper-moved
        intent: Put the sharp first shot with my picks
        expected: M (or Move in the bottom bar) moves it to Selection; a toast and the count confirm it

  - id: U-MAC-02
    title: Keep a photo together with its RAW file and sidecar
    goal: The first photo of the shoot was shot RAW plus JPEG and has a settings file next to it. Move it, take that back, then copy it instead.
    use_case: UC-4
    steps:
      - launch: {}
      - wait_for: {id: dock_move, timeout_ms: 10000}
      - screen: first-photo-with-companions
        intent: Find out whether this photo has other files with it
        expected: The photo's badges show its RAW and sidecar; the bottom bar offers Move (M), Copy (C), Trash and Undo
      - key: M
      - wait_ms: 300
      - screen: moved-with-companions
        intent: Make sure the photo went to my picks with its RAW file and settings
        expected: A toast confirms the move to Selection and the count shows one selected
      - key: Cmd+Z
      - wait_ms: 300
      - screen: move-undone
        intent: Put everything back exactly where it was
        expected: Cmd+Z (or Undo) brings the photo and its files back to the shoot folder
      - key: C
      - wait_ms: 300
      - screen: copied-with-companions
        intent: Copy it instead, so the original stays where it is
        expected: C copies it to Selection; the toast says copied and the count shows one copied

  - id: U-MAC-03
    title: Library statistics
    goal: Get an overview of the whole shoot — how many photos, which lenses, how sharp — then go back to culling.
    use_case: UC-14
    steps:
      - launch: {}
      # The sheet's quality figures count only the photos scored so far (the prefetch window
      # around the current photo): 1 of 17 here, also after a 15 s wait (2026-10-24, backlog).
      - wait_ms: 4000
      - screen: workspace-before-tools
        intent: Find a summary of the whole shoot
        expected: Cmd+L (or Tools > Library Statistics) opens it
      - key: Cmd+L
      - wait_ms: 2000
      - screen: library-statistics
        intent: Read how many photos there are, how sharp they are, and which were the sharpest
        expected: A sheet with the shoot summary, the sharpness split and the sharpest photos; Done closes it
      - key: Escape
      - wait_ms: 500
      - screen: back-in-workspace
        intent: Get back to my photos
        expected: Escape (or Done) closes the sheet; the photo I was on is still there
